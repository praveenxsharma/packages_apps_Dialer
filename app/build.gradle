plugins {
    id 'com.android.application'
}

android {
    namespace "com.android.dialer"
    compileSdk 36 // Android 16

    defaultConfig {
        applicationId "com.android.dialer"
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName "1.0-MistOS"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Dynamic Source Set Mapping
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            assets.srcDirs = ['assets']
            
            // This script finds all 'res' folders nested in your java structure
            def resDirs = []
            fileTree(dir: 'java', include: '**/res').each { file ->
                if (file.isDirectory()) resDirs << file
            }
            // Add root res if it exists
            if (file('res').exists()) resDirs << file('res')
            
            res.srcDirs = resDirs
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Dialer Specific Dependencies
    implementation 'com.google.guava:guava:33.0.0-android'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // Protocol Buffers (Needed for Dialer Protos)
    implementation 'com.google.protobuf:protobuf-javalite:3.25.1'

    // Reflection/Injection (AOSP Dialer often uses Dagger, but we use compileOnly for stubs)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
