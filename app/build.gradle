android {
    namespace "com.android.dialer"
    compileSdk 36

    defaultConfig {
        applicationId "com.android.dialer"
        minSdk 35 // Android 15
        targetSdk 36 // Android 16
        versionCode 1
        versionName "1.0-MistOS"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            assets.srcDirs = ['assets']
            
            // This is the most reliable way to find all AOSP resource folders
            def resDirectories = []
            file('java').eachDirRecurse { dir ->
                if (dir.name == 'res') {
                    resDirectories << dir
                }
            }
            // Include the root res if you have one
            if (file('res').exists()) resDirectories << file('res')
            
            res.srcDirs = resDirectories
        }
    }
    
    // Required for AOSP Dialer's call recording and simulator features
    buildFeatures {
        aidl true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
